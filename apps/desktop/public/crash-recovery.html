<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>Agent Calendar 복구</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        background: #f5f2ec;
        color: #29251f;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      main {
        width: min(440px, 100%);
        padding: 28px;
        border: 1px solid #d9d2c7;
        border-radius: 16px;
        background: #fffdf9;
      }
      img { width: 32px; height: 32px; border-radius: 8px; }
      h1 { margin: 20px 0 8px; font-size: 20px; letter-spacing: -.02em; }
      p { margin: 0; color: #6e665b; font-size: 13px; line-height: 1.65; }
      a {
        min-height: 38px;
        margin-top: 24px;
        display: inline-grid;
        place-items: center;
        padding: 0 16px;
        border: 1px solid #bd5438;
        border-radius: 9px;
        background: #d7613d;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      small { display: block; margin-top: 14px; color: #8a8175; font-size: 11px; }
      @media (prefers-color-scheme: dark) {
        :root { background: #2b2721; color: #f2eee8; }
        main { border-color: #554d42; background: #373129; }
        p, small { color: #bdb4a8; }
      }
      :root:has(#dark:target) { background: #2b2721; color: #f2eee8; }
      :root:has(#dark:target) main { border-color: #554d42; background: #373129; }
      :root:has(#dark:target) p,
      :root:has(#dark:target) small { color: #bdb4a8; }
    </style>
  </head>
  <body>
    <main id="dark">
      <img src="./agent-calendar-logo.png" alt="" />
      <h1>Agent Calendar를 안전하게 멈췄습니다</h1>
      <p>짧은 시간에 반복되는 화면 오류를 감지해 자동 재시작을 중단했습니다. 저장된 Workspace 데이터와 오프라인 보관본은 삭제하지 않았습니다.</p>
      <a href="./index.html?recovery=manual">안전하게 다시 열기</a>
      <small>문제가 반복되면 현재 버전과 발생 시각을 함께 알려주세요.</small>
    </main>
  </body>
</html>
